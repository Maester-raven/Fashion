      - mmcv==2.1.0
      - mmengine==0.10.7
      - mmdet==3.3.0
      - opencv-python==4.8.1.78
      - pycocotools
      - onnx
      - onnxruntime
      - timm
      - scipy
      - tqdm
      - pytest
